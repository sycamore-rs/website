name: Sync Submodule

on:
  # This workflow is triggered every time the docs is changed in sycamore-rs/sycamore
  repository_dispatch:
    types: [update-submodule]
  workflow_dispatch:

jobs:
  sync:
    name: Sync Submodule
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow submodule clones only fetch the default branch. Fetch all
          # history so --remote can resolve each branch configured in .gitmodules.
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.CI_TOKEN }}

      - name: update submodule git references
        run: |
          # Tracking branches are configured in .gitmodules.
          git submodule update --remote --recursive

      - name: commit update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.CI_TOKEN }}@github.com/${{ github.repository }}
          git add -- checkouts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto updated submodule references"
            git push
          fi
